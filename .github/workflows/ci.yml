name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-26.04
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      # 'node26' must match node-version above: native binding ABI differs per major.
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # A hit skips npm ci, so keep the manifest/lockfile consistency check
      # it performs: a package.json change without a lockfile update must fail.
      - name: Verify lockfile matches package.json
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npm ci --ignore-scripts --dry-run
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p .

  build-and-test:
    name: Build & test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - name: Configure Windows native build
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV
      # 'node26' must match node-version above: native binding ABI differs per major.
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # See above: keep the manifest/lockfile consistency check on a cache hit.
      - name: Verify lockfile matches package.json
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npm ci --ignore-scripts --dry-run
      - name: Compute VS Code test cache period
        # vscode-test tracks the latest stable release; rotate the key weekly
        # so a new release eventually replaces the cached binary.
        run: echo "VSCODE_TEST_WEEK=$(date +%Y-W%V)" >> "$GITHUB_ENV"
      - name: Restore VS Code test binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ env.VSCODE_TEST_WEEK }}-${{ hashFiles('package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify native binding (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          echo "Noble native binding:"
          ls -la node_modules/@abandonware/noble/build/Release/binding.node
      - name: Verify native binding (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "bluetooth-hci-socket native binding:"
          ls -la node_modules/@abandonware/bluetooth-hci-socket/build/Release/bluetooth_hci_socket.node
      - name: Build
        run: npm run compile
      - name: Compile tests
        run: npm run compile-tests
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx vscode-test
      - name: Test (non-Linux)
        if: runner.os != 'Linux'
        run: npx vscode-test
