name: WASM Build

on:
  push:
    branches: [main]
    paths:
      - 'mruby_build_config.rb'
      - 'Makefile'
      - 'vendor/mruby/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mrbc-wasm:
    runs-on: ubuntu-26.04

    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve mruby submodule SHA
        run: echo "MRUBY_SHA=$(git rev-parse HEAD:vendor/mruby)" >> "$GITHUB_ENV"

      # 'emsdk7.0.1' and 'ruby4' must match the toolchain versions configured below.
      - name: Restore mruby build cache
        id: mruby-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/mruby/build
            resources/wasm_build
          key: mruby-wasm-${{ runner.os }}-emsdk7.0.1-ruby4-${{ env.MRUBY_SHA }}-${{ hashFiles('mruby_build_config.rb', 'Makefile') }}
      # Fresh checkouts give sources newer mtimes than the restored objects,
      # which would make rake recompile them all. Mark objects fresh instead:
      # the key already guarantees identical inputs, so outputs are equivalent.
      - name: Mark restored objects fresh
        if: steps.mruby-build-cache.outputs.cache-hit == 'true'
        run: find vendor/mruby/build resources/wasm_build -exec touch {} + 2>/dev/null || true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.1
          actions-cache-folder: .emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'

      - name: Build mrbc WASM
        run: make mrbc

      - name: Verify output
        run: |
          ls -la resources/wasm/mrbc.js
          ls -la resources/wasm/mrbc.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrbc-wasm
          path: |
            resources/wasm/mrbc.js
            resources/wasm/mrbc.wasm
          retention-days: 30
