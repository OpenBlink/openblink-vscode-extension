name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Release gate (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p .
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Version: $TAG"
      - name: Build
        run: npm run compile
      - name: Compile tests
        run: npm run compile-tests
      - name: Test
        run: xvfb-run -a npx vscode-test

  build-wasm:
    name: Build mrbc WASM
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.1
      - name: Verify Emscripten
        run: emcc --version
      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.4'
      - name: Build mrbc WASM
        run: make mrbc
      - name: Verify mrbc WASM output
        run: |
          ls -la resources/wasm/mrbc.js
          ls -la resources/wasm/mrbc.wasm
      - name: Upload WASM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: resources/wasm/

  build:
    name: Build VSIX (${{ matrix.target }})
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15
            target: darwin-x64
            node_arch: x64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # NOTE: linux-armhf is a best-effort cross-build. QEMU enables
          # running ARM binaries via binfmt_misc but npm ci still compiles
          # native Node addons for the host (x86_64) architecture. BLE
          # native bindings in this VSIX may not work on real armhf devices.
          - os: ubuntu-latest
            target: linux-armhf
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          check-latest: true
          architecture: ${{ matrix.node_arch || '' }}
      - name: Set up QEMU (cross-build)
        if: matrix.cross
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Configure Windows native build
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: npm ci
      - name: Verify native binding (macOS/Windows)
        if: runner.os != 'Linux' && !matrix.cross
        shell: bash
        run: |
          echo "Noble native binding:"
          ls -la node_modules/@abandonware/noble/build/Release/binding.node
      - name: Verify native binding (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        shell: bash
        run: |
          echo "bluetooth-hci-socket native binding:"
          ls -la node_modules/@abandonware/bluetooth-hci-socket/build/Release/bluetooth_hci_socket.node
      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: resources/wasm/
      - name: Remove unnecessary bluetooth-hci-socket (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: rm -rf node_modules/@abandonware/bluetooth-hci-socket
      - name: Package VSIX (${{ matrix.target }})
        run: npx --yes @vscode/vsce@4 package --target ${{ matrix.target }}
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  publish:
    name: Publish (Marketplace + Open VSX + GitHub Releases)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          check-latest: true
      - name: Install publishers
        run: npm install -g @vscode/vsce@4 ovsx@1
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
      - name: List VSIX files
        run: ls -la vsix
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: vsix/*.vsix
      - name: Publish to VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.AZURE_PAT }}
        run: vsce publish --packagePath vsix/*.vsix --skip-duplicate
      - name: Publish to Open VSX
        id: openvsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          failed=0
          for file in vsix/*.vsix; do
            echo "Publishing $file to Open VSX..."
            ovsx publish "$file" --skip-duplicate || { echo "::warning::Open VSX publish failed for $file"; failed=1; }
          done
          exit $failed
      - name: Create GitHub Release
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: vsix/*.vsix
      - name: Publish summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "# OpenBlink Release Summary";
            echo "";
            echo "| Channel | Result |";
            echo "|---------|--------|";
            echo "| VS Code Marketplace | ${{ steps.marketplace.outcome }} |";
            echo "| Open VSX | ${{ steps.openvsx.outcome }} |";
            echo "| GitHub Release | success |";
            echo "";
            echo "## Artifacts";
            find vsix -type f -printf '- %f\n';
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.marketplace.outcome }}" = "failure" ]; then
            echo "::warning::VS Code Marketplace publish failed"
          fi
          if [ "${{ steps.openvsx.outcome }}" = "failure" ]; then
            echo "::warning::Open VSX publish failed"
          fi
