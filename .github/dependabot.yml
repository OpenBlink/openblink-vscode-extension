version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    ignore:
      # Must stay pinned to the minimum VS Code API declared in engines.vscode.
      # Update manually only when engines.vscode is raised.
      - dependency-name: "@types/vscode"
      # Safeguard: never bump anything named "vscode". Note that Dependabot
      # only updates dependencies and never rewrites the engines field itself.
      - dependency-name: "vscode"
      # Must match the Node.js version of the VS Code extension host
      # (Node 22 for VS Code 1.102+). Allow minor/patch updates within 22.x.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 is the native (tsgo) compiler: the npm package only
      # exposes unstable ./unstable/* API entry points, so ts-loader 9 and
      # `tsc -p .` cannot consume it. Stay on 6.x until the toolchain story
      # for bundlers is settled.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      devDependencies:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "webpack*"
          - "ts-loader"
          - "typescript"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github_actions
